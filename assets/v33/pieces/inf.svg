.gr{fill:var(--illos-dx-white,var(--_dx-white))}
.lit{opacity:0;animation:dx-inf_lit 5s linear}
.glow{opacity:0;animation:dx-inf_glow 5s linear}
.ndl{transform-box:view-box;transform-origin:186px 146px;transform:rotate(-78deg);animation:dx-inf_ndl 5s linear}
@keyframes dx-inf_lit{0%{opacity:0}4%{opacity:0;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}12%{opacity:.32}60%{opacity:.32;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}72%{opacity:0}100%{opacity:0}}
@keyframes dx-inf_glow{0%{opacity:0}40%{opacity:0;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}48%{opacity:1}78%{opacity:.55;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}84%{opacity:0}100%{opacity:0}}
@keyframes dx-inf_ndl{0%{transform:rotate(-78deg)}11%{transform:rotate(-78deg);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}31%{transform:rotate(50deg);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}47%{transform:rotate(22deg)}78%{transform:rotate(22deg);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}96%{transform:rotate(-78deg)}100%{transform:rotate(-78deg)}}
*{animation-iteration-count:infinite!important;animation-play-state:var(--illos-play,running)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
}
</style>
