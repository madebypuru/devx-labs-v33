<svg class="dx-inf" xmlns="http://www.w3.org/2000/svg" width="372" height="300" viewBox="0 0 372 300" fill="none" stroke="#14162e" role="img" aria-labelledby="dx-inf-t" aria-describedby="dx-inf-d">
<title id="dx-inf-t">Inference engineering</title>
<desc id="dx-inf-d">A glass dial on a pink field standing on a glass base of compute: as load runs the base lights, the needle swings up and settles into the target band, then the base goes quiet and the needle returns to rest.</desc>
<style>
@scope (svg.dx-inf) {
:scope{stroke:none;--_dx-field:#fc88ab;--_dx-top:#ffc041;--_dx-fringe:#ffe27a;--_dx-white:#ffffff;--_dx-paper:#f7f6f3;--_dx-ink:#14162e;--_dx-live:#0bf789;--_dx-alert:#ff381c;--_dx-chip:#f1f1f1;--_dx-glow:#4b9efe}
