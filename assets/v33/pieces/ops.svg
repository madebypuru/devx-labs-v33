<svg class="dx-ops" xmlns="http://www.w3.org/2000/svg" width="372" height="300" viewBox="0 0 372 300" fill="none" stroke="#14162e" role="img" aria-labelledby="dx-ops-t" aria-describedby="dx-ops-d">
<title id="dx-ops-t">Model pipeline</title>
<desc id="dx-ops-d">A glass track on a mint field runs through three glass hoops, build, eval and release: small glass versions ride it, each stopping in the eval hoop until its check passes, then riding on through release and out.</desc>
<style>
@scope (svg.dx-ops) {
:scope{stroke:none;--_dx-field:#61cd9c;--_dx-top:#92e588;--_dx-fringe:#ffe27a;--_dx-white:#ffffff;--_dx-paper:#f7f6f3;--_dx-ink:#14162e;--_dx-live:#0bf789;--_dx-alert:#ff381c;--_dx-chip:#f1f1f1;--_dx-glow:#4b9efe}
@media (prefers-color-scheme: dark){:scope{--_dx-field:#61cd9c;--_dx-top:#92e588;--_dx-fringe:#ffe27a;--_dx-white:#ffffff;--_dx-paper:#f7f6f3;--_dx-ink:#14162e;--_dx-live:#0bf789;--_dx-alert:#ff381c;--_dx-chip:#f1f1f1;--_dx-glow:#4b9efe}}
.fld{fill:var(--illos-dx-field,var(--_dx-field))}
.st-top{stop-color:var(--illos-dx-top,var(--_dx-top))}.st-fld{stop-color:var(--illos-dx-field,var(--_dx-field))}.st-w{stop-color:var(--illos-dx-white,var(--_dx-white))}.st-fr{stop-color:var(--illos-dx-fringe,var(--_dx-fringe))}
.pap{fill:var(--illos-dx-paper,var(--_dx-paper))}.tp{fill:var(--illos-dx-top,var(--_dx-top))}.frn{fill:var(--illos-dx-fringe,var(--_dx-fringe))}.wht{fill:var(--illos-dx-white,var(--_dx-white))}.ink{fill:var(--illos-dx-ink,var(--_dx-ink))}
.wl{fill:none;stroke:var(--illos-dx-white,var(--_dx-white))}.fld-s{stroke:var(--illos-dx-field,var(--_dx-field))}
.chp{fill:var(--illos-dx-chip,var(--_dx-chip))}.chs{fill:var(--illos-dx-glow,var(--_dx-glow))}
.liv{fill:var(--illos-dx-live,var(--_dx-live))}.alr{fill:var(--illos-dx-alert,var(--_dx-alert))}
.cur{fill:var(--illos-dx-ink,var(--_dx-ink));stroke:var(--illos-dx-white,var(--_dx-white));stroke-width:1.6px;stroke-linejoin:round}
.txt{fill:var(--illos-dx-white,var(--_dx-white));font-family:"Inter Display",Inter,system-ui,sans-serif;font-size:10.26px;letter-spacing:-.2px}
.gr{fill:var(--illos-dx-white,var(--_dx-white))}
.ver{transform:translate(186px,0px);animation:dx-ops_ver 5s linear}
.ver-b{transform:translate(-52px,0px);animation-delay:-2.5s}
.fl-build{opacity:0;animation:dx-ops_fl-build 2.5s linear}
.fl-rel{opacity:0;animation:dx-ops_fl-rel 2.5s linear}
.fl-eval{opacity:0;animation:dx-ops_fl-eval 2.5s linear}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:dx-ops_pop 2.5s linear}
.chk{opacity:1;animation:dx-ops_chk 2.5s linear}
@keyframes dx-ops_ver{0%{transform:translate(186px,0px)}8%{transform:translate(186px,0px);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}28%{transform:translate(424px,0px)}28.4%{transform:translate(-52px,0px)}60%{transform:translate(-52px,0px);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}90%{transform:translate(186px,0px)}100%{transform:translate(186px,0px)}}
@keyframes dx-ops_fl-build{0%{opacity:0}43.111%{opacity:0;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}50.311%{opacity:1;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}70.711%{opacity:0}100%{opacity:0}}
@keyframes dx-ops_fl-rel{0%{opacity:0}29.609%{opacity:0;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}36.809%{opacity:1;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}57.209%{opacity:0}100%{opacity:0}}
@keyframes dx-ops_fl-eval{0%{opacity:0}80.8%{opacity:0;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}85.6%{opacity:1;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}98.4%{opacity:0}100%{opacity:0}}
@keyframes dx-ops_pop{0%{transform:scale(1)}81.6%{transform:scale(1);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}86.4%{transform:scale(1.08);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}96%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes dx-ops_chk{0%{opacity:1}24%{opacity:1;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}36%{opacity:.14}82%{opacity:.14;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}92%{opacity:1}100%{opacity:1}}
*{animation-iteration-count:infinite!important;animation-play-state:var(--illos-play,running)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
}
</style>
