<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What we build · illustrations</title>
<style>
:root { --ink: #14162e; --t2: rgba(20,22,46,.62); --line: rgba(20,22,46,.09); --paper: #fff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Inter Display", Inter, system-ui, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 56px 16px 80px; }

.lead { color: var(--t2); margin: 0 0 40px; max-width: 640px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 24px; }
figure { margin: 0; }
figure.wide { grid-column: span 2; }
img { display: block; width: 100%; height: auto; border-radius: 12px; }
figcaption { margin-top: 14px; display: grid; gap: 2px; }
figcaption b { font-weight: 600; font-size: 17px; }
figcaption span { color: var(--t2); }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } figure.wide { grid-column: auto; } h1 { font-size: 32px; } }
